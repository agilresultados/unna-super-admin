<!doctype html>
<html lang="pt-BR" class="sa-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Unna Superadmin</title>
    <script>
      // Aplica tema antes do paint para evitar flash (FOUC)
      (function () {
        try {
          var t = localStorage.getItem('sa-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          var root = document.documentElement;
          if (t === 'dark') root.classList.add('sa-dark');
          else root.classList.remove('sa-dark');
          root.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('sa-dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
